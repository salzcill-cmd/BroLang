[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brolang"
version = "6.2.0"
description = "Bahasa pemrograman profesional berbasis Bahasa Indonesia untuk game development"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "BroLang Team", email = "team@brolang.dev"},
]
keywords = ["programming-language", "indonesian", "game-development", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Education",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/salzcill-cmd/BroLang"
Repository = "https://github.com/salzcill-cmd/BroLang"
Issues = "https://github.com/salzcill-cmd/BroLang/issues"

[project.scripts]
bro = "brolang.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
game = [
    "pygame-ce>=2.1.0",
]

[tool.setuptools.packages.find]
include = ["brolang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
